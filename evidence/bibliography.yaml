# Every research claim used in docs or design points here. type is required:
#   peer-reviewed | preprint | vendor-claim | blog | our-own
- id: huang-2023
  claim: Models are weak at correcting their own reasoning without external feedback.
  ref: "Huang et al., arXiv 2310.01798"
  type: preprint
- id: kamoi-2024
  claim: Self-correction works mainly when reliable external feedback exists.
  ref: "Kamoi et al., TACL 2024"
  type: peer-reviewed
- id: panickssery-2024
  claim: Models prefer their own output when judging.
  ref: "Panickssery et al., arXiv 2404.13076"
  type: preprint
- id: kim-2025
  claim: Different models share a large part of their errors (about 60%).
  ref: "Kim et al., ICML 2025, arXiv 2506.07962"
  type: peer-reviewed
- id: nine-judges-2026
  claim: Many judges give few effective votes.
  ref: "arXiv 2605.29800 (single author)"
  type: preprint
- id: maker-2025
  claim: Extreme decomposition into minimal steps with voting can run over a million steps without error; decomposition was given by humans.
  ref: "arXiv 2511.09030"
  type: preprint
- id: factscore-2023
  claim: Splitting text into atomic facts allows finer checking.
  ref: "arXiv 2305.14251"
  type: peer-reviewed
- id: bansal-2021
  claim: People over-rely on AI suggestions even when explanations are given.
  ref: "Bansal et al., arXiv 2006.14779"
  type: peer-reviewed
- id: eai-central-claim
  claim: Bottom-up assembly from verified atoms is more reliable and inspectable than top-down generation.
  ref: "Not yet tested. Milestone M8."
  type: our-own
