async function requestBuilderProposal(event){
  event.preventDefault();
  try{
    const id=document.getElementById('composedWorkerId')?.value.trim();
    const name=document.getElementById('composedWorkerName')?.value.trim();
    s.builderProposal=await postOps('/ops/builders/compose',{id,name});

}

  try{
    const id=s.builderProposal.contract.id;
    await postOps('/ops/events',{type:'worker.register',contract:s.builderProposal.contract});
    s.builderProposal=null;s.builderError='';s.selectedOpsWorker=id;s.opsNotice='Samengestelde kandidaat geregistreerd. Voer nu vaste tests uit en vraag daarna vrijgave.';

}

async function decideOps(defectId,choice){
  if(!s.liveOps||!opsToken)return;
  const rationale=(document.getElementById('reason-'+defectId)?.value||'').trim();
  if(!rationale){s.liveError='Vul eerst een motivering in.';render();return}
  try{
    const r=await fetch('/ops/events',{method:'POST',headers:{Authorization:'Bearer '+opsToken,'Content-Type':'application/json'},body:JSON.stringify({type:'human.decide',defectId,choice,rationale})});
    if(!r.ok){let error='HTTP '+r.status;try{error=(await r.json()).error||error}catch{};throw new Error(error)}
    await connectOps();s.route='hitl';s.liveError='';render();
  }catch(e){s.liveError=String(e.message||e);render();}
}

async function registerBuiltin(id){
  try{
    const tasks={ "text-normalize":"text-normalize","text-metrics":"text-metrics" };
    if(!Object.prototype.hasOwnProperty.call(tasks,id))throw new Error('Onbekende lokale worker');
    const contract={id,version:"1.0.0",name:id==="text-normalize"?"Text Normalize":"Text Metrics",
      specialization:id==="text-normalize"?"Kleine lokale tekstnormalisatie":"Lokale woord- en tekencontrole",
      taskKinds:[tasks[id]],inputSchema:{type:"object",properties:{text:{type:"string"}},required:["text"]},
      outputSchema:{type:"object"},tools:[],requestedPermissions:[],
      modelPolicy:{preferred:"deterministic"},testSuite:"builtin-fixture-v1",stopConditions:["invalid-input"]};
    await postOps('/ops/events',{type:"worker.register",contract});
    await connectOps();s.selectedOpsWorker=id;s.opsNotice='Kandidaat vastgelegd. Test de worker voordat je hem vrijgeeft.';s.liveError='';render();
  }catch(err){s.liveError=String(err.message||err);render()}
}

async function checkReleaseBytes(id,revision,name){
  try{
    if(!onExecutionServer()||!opsToken)throw new Error('Verbind eerst met de beveiligde EAIwork-server.');
    const input=document.getElementById('artifact-file-'+id),file=input?.files?.[0];
    if(!file)throw new Error('Kies eerst het bestand dat bij het opleverdossier hoort.');
    if(file.name!==name)throw new Error('De geselecteerde bestandsnaam wijkt af van het opleverdossier.');
    if(file.size<1||file.size>16*1024*1024)
      throw new Error('Het bestand moet tussen 1 byte en 16 MB groot zijn.');
    const reply=await fetch('/ops/missions/'+encodeURIComponent(id)+'/release/verify-bytes',{
      method:'POST',redirect:'error',cache:'no-store',
      headers:{Authorization:'Bearer '+opsToken,'Content-Type':'application/octet-stream',
        'X-EAI-Artifact-Name':file.name,'X-EAI-Mission-Revision':String(revision)},
      body:file,
    });
    if(!reply.ok)throw new Error('Bestandscontrole geweigerd (HTTP '+reply.status+'). Controleer de SHA-256 en de versie.');
    s.opsNotice='De SHA-256 van het gekozen bestand komt overeen. De herkomst uit GitHub Actions en de licentie zijn nog niet gecontroleerd.';
    s.liveError='';await connectOps();s.route='overzicht';

async function connectOps(){
  if(!onExecutionServer()){s.liveError='Deze openbare pagina ondersteunt geen serverlogin.';render();return}
  const field=document.getElementById('ops-token');
  const token=field?.value?.trim()||opsToken;
  if(!token){s.liveError='Vul eerst een toegangstoken in.';render();return}
  try{
    const r=await fetch('/ops/state',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status+'; controleer of de operations-API op deze server actief is en of je auditrechten hebt.');
    const data=await r.json();
    if(!data||!data.workers||!Array.isArray(data.measurements))throw new Error('Server geeft geen geldig workerregister terug.');
    opsToken=token;s.liveOps=data;s.liveError='';s.selectedOpsWorker=Object.keys(data.workers)[0]||null;
    try {const cr=await fetch('/ops/catalog',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
      s.liveCatalog=cr.ok?await cr.json():null;
    } catch {s.liveCatalog=null;}
    try {
      const lineResponse=await fetch('/ops/production-line',
        {headers:{Authorization:'Bearer '+token},cache:'no-store'});
      if(!lineResponse.ok)throw new Error('Productieoverzicht niet beschikbaar (HTTP '+lineResponse.status+').');
      const line=await lineResponse.json();
      if(line.schema!=='eai-production-line-v1'||line.operationsJournalVerified!==true||
         !Array.isArray(line.missions))throw new Error('Productieoverzicht heeft een onbekend of ongecontroleerd formaat.');
      s.productionLine=line;s.productionLineError='';
    }catch(error){
      s.productionLine=null;s.productionLineError=String(error.message||error);
    }
  }catch(e){s.liveOps=null;s.productionLine=null;s.productionLineError='';s.liveError=String(e.message||e)}
  render();
}
async function registerOps(e){
  e.preventDefault();
  const v=id=>document.getElementById(id).value.trim();
  const split=id=>v(id).split(',').map(x=>x.trim()).filter(Boolean);
  let inputSchema,outputSchema;
  try{inputSchema=JSON.parse(v('ops-input-schema'));outputSchema=JSON.parse(v('ops-output-schema'));
    if(!inputSchema||typeof inputSchema!=='object'||Array.isArray(inputSchema)||!outputSchema||typeof outputSchema!=='object'||Array.isArray(outputSchema))throw new Error('Schemas moeten objecten zijn');
  }catch(err){s.liveError='Ongeldig JSON-schema: '+err.message;render();return;}
  const contract={id:v('ops-id'),version:v('ops-version'),name:v('ops-name'),specialization:v('ops-specialization'),taskKinds:[v('ops-taskkind')],
    inputSchema,outputSchema,tools:split('ops-tools'),requestedPermissions:split('ops-permissions'),
    modelPolicy:{preferred:v('ops-model')},testSuite:v('ops-suite'),stopConditions:[v('ops-stop')]};
  if(!s.liveOps){s.workers.push({id:contract.id,name:contract.name,role:contract.specialization,group:'Uitvoeren',size:v('ops-model'),model:v('ops-model'),tools:contract.tools.join(', '),permissions:contract.requestedPermissions.join(', '),success:0,baseline:0,drift:0,status:'proef',repairs:0,total:0,ver:contract.version,skills:contract.taskKinds});s.selectedOpsWorker=contract.id;s.liveError='Voorbeeldcontract toegevoegd; niet opgeslagen op een server.';render();return;}
  try {
    const r=await fetch('/ops/events',{method:'POST',headers:{Authorization:'Bearer '+opsToken,'Content-Type':'application/json'},body:JSON.stringify({type:'worker.register',contract})});
    if(!r.ok){let message='HTTP '+r.status;try{const j=await r.json();message=j.error||message}catch{};throw new Error(message);}
    s.liveError='';await connectOps();
    s.selectedOpsWorker=contract.id;render();
  }catch(err){s.liveError=String(err.message||err);render();}
}


async function runBrowserProbe(){
  const result={date:new Date().toISOString(),gpu:"Niet beschikbaar",wasm:typeof WebAssembly==="object",cpu:navigator.hardwareConcurrency??"Niet gemeld",storage:"Niet vastgesteld",model:"Niet geladen",background:"Niet ondersteund als betrouwbare langdurige uitvoering"};
  try {
    if(navigator.gpu&&typeof navigator.gpu.requestAdapter==="function"){
      const adapter=await navigator.gpu.requestAdapter();
      result.gpu=adapter?"WebGPU-adapter beschikbaar":"WebGPU beschikbaar, maar geen bruikbare adapter";
    }
  }catch(e){result.gpu="WebGPU-controle mislukt";}
  try {
    if(navigator.storage?.estimate){
      const estimate=await navigator.storage.estimate();
      result.storage=estimate.quota?Math.round(estimate.quota/1048576)+" MB geschatte opslagruimte":"Niet beschikbaar";
    }
  }catch{}
  s.browserProbe=result;s.route='browser';render();
}

function liveMissionProgress(m){
  const ts=Object.values(m.tasks||{});
  const done=ts.filter(t=>t.status==='done').length,failed=ts.filter(t=>t.status==='failed').length;
  const gates=m.plan.constraints||[];
  const blocked=(t)=>gates.some(g=>(g.taskIds||[]).includes(t.spec.id)&&
    (g.kind==='prohibition'||(['approval','condition','deadline'].includes(g.kind)&&!m.resolvedGates?.[g.id])));
  const ready=ts.filter(t=>t.status==='queued'&&!blocked(t)&&(t.spec.dependsOn||[]).every(id=>m.tasks[id]?.status==='done')).length;
  const blockedByConstraints=ts.filter(t=>t.status==='queued'&&blocked(t)).length;
  return {done,total:ts.length,failed,ready,blockedByConstraints,status:m.paused?'Pauze':done===ts.length?'Afgerond':failed?'Beoordeling nodig':ready?'Gereed voor volgende stap':blockedByConstraints?'Wacht op toestemming of voorwaarde':'Wacht op vorige taak'};
}

async function controlAutomation(id,action){
  try{
    let payload={};
    if(action==='start'){
      const accepted=document.getElementById('automaticConsent')?.checked;
      const limit=Number(document.getElementById('automaticLimit')?.value);
      if(!accepted)throw new Error('Vink eerst de toestemming voor deze opdracht aan.');
      if(!Number.isInteger(limit)||limit<1||limit>32)throw new Error('Kies een taakmaximum tussen 1 en 32.');
      payload={maxStarts:limit};
    }
    await postOps('/ops/missions/'+encodeURIComponent(id)+'/automation/'+action,payload);
    s.liveRunNote=action==='start'?'Automatisch uitvoeren gestart binnen het goedgekeurde taakmaximum.':
      'Automatische uitvoering gestopt. De uitgevoerde taken en besluiten blijven bewaard.';
    s.liveError='';await connectOps();s.route='uitvoering';
  }catch(error){s.liveError=String(error.message||error);render();}
}
function updateAutomationPolling(){
  const active=onExecutionServer()&&['overzicht','uitvoering'].includes(s.route)&&!!opsToken&&
    Object.values(s.liveOps?.missions||{}).some(m=>m.automation?.enabled||
      Object.values(m.tasks||{}).some(t=>t.status==='running'));
  if(!active&&opsPollTimer){clearInterval(opsPollTimer);opsPollTimer=null;return}
  if(!active||opsPollTimer)return;
  opsPollTimer=setInterval(async()=>{
    if(opsPollBusy||!opsToken||!['overzicht','uitvoering'].includes(s.route))return;
    opsPollBusy=true;
    try{
      const r=await fetch('/ops/state',{headers:{Authorization:'Bearer '+opsToken},cache:'no-store'});
      if(!r.ok)throw new Error('Het automatisch verversen van de status is gestopt.');
      const data=await r.json();
      let latestLine=null;
      try{
        const response=await fetch('/ops/production-line',
          {headers:{Authorization:'Bearer '+opsToken},cache:'no-store'});
        if(!response.ok)throw new Error('Productieoverzicht niet beschikbaar (HTTP '+response.status+').');
        latestLine=await response.json();
        if(latestLine.schema!=='eai-production-line-v1'||
           latestLine.operationsJournalVerified!==true)throw new Error('Ongecontroleerd productieoverzicht.');
        s.productionLineError='';
      }catch(error){s.productionLineError=String(error.message||error);}
      if(JSON.stringify(data.missions)!==JSON.stringify(s.liveOps?.missions)||
         (latestLine&&JSON.stringify(latestLine)!==JSON.stringify(s.productionLine))||
         s.productionLineError){
        s.liveOps=data;
        if(latestLine)s.productionLine=latestLine;
        render();
      }
    }catch(error){
      s.liveError=String(error.message||error);
      if(opsPollTimer){clearInterval(opsPollTimer);opsPollTimer=null}
      render();
    }finally{opsPollBusy=false}
  },1200);
}

async function postOps(path,event){
  if(!onExecutionServer()||!opsToken)throw new Error('Verbind eerst met de eigen EAIwork-server.');
  const r=await fetch(path,{method:'POST',headers:{Authorization:'Bearer '+opsToken,'Content-Type':'application/json'},
    body:JSON.stringify(event??{}),cache:'no-store'});
  if(!r.ok){let msg='HTTP '+r.status;try{const detail=await r.json();msg=detail.error||msg}catch{};throw new Error(msg)}
  return r.json();
}
async function createRealMission(event){

  const id='mission-'+Date.now();

    {id:'task-metrics',title:'Woorden en tekens tellen',taskKind:'text-metrics',dependsOn:['task-normalize'],textFrom:'task-normalize'},
  ]};

}
async function controlRealMission(id,operation){

      'Uitvoerloop: '+result.batches.length+' rondes, '+result.progress.done+'/'+result.progress.total+' afgerond. Stopreden: '+result.stopReason+'.':
      operation==='pause'?'Opdracht gepauzeerd.':'Opdracht hervat.';
    s.liveError='';await connectOps();
  }catch(err){s.liveError=String(err.message||err);render();}
}
async function retryRealTask(missionId,taskId){
  try{
    const reason=(document.getElementById('retry-'+missionId+'-'+taskId)?.value||'').trim();

}
async function runRealMission(id){
  try{
    const result=await postOps('/ops/missions/'+encodeURIComponent(id)+'/step',{});
    s.liveRunNote='Uitvoering: '+result.completed.length+' afgerond; '+result.blocked.length+' niet gestart.'+

}

async function refreshEvidence(){
  if(!onExecutionServer()||!opsToken){s.evidenceError='Verbind eerst met de eigen EAIwork-server.';render();return}
  try{
    const response=await fetch('/state',{headers:{Authorization:'Bearer '+opsToken},cache:'no-store'});
    if(!response.ok)throw new Error('Geen toestemming voor de bewijsregistratie (HTTP '+response.status+').');
    s.evidenceState=await response.json();s.evidenceError='';
    const ids=Object.keys(s.evidenceState.atoms||{});
    if(!ids.includes(s.evidenceAtom))s.evidenceAtom=ids[0]||null;
    if(s.evidenceAtom)return await selectEvidenceAtom(s.evidenceAtom);
    s.evidenceDetail=null;render();
  }catch(e){s.evidenceState=null;s.evidenceDetail=null;s.evidenceError=String(e.message||e);render()}
}
async function selectEvidenceAtom(id){
  if(!s.evidenceState?.atoms?.[id]||!opsToken)return;
  try{
    const r=await fetch('/explain/'+encodeURIComponent(id),{headers:{Authorization:'Bearer '+opsToken},cache:'no-store'});
    if(!r.ok)throw new Error('Geen toegang tot dit atoom (HTTP '+r.status+').');
    s.evidenceDetail=await r.json();s.evidenceAtom=id;s.evidenceError='';render();
  }catch(e){s.evidenceDetail=null;s.evidenceError=String(e.message||e);render();}
}

sitoryzoekactie uitgevoerd.'};s.route='builder';break;case 'toggleRepair':s.settings.autoRepair=!s.settings.autoRepair;break;case 'decide':{const d=s.hitl.find(x=>x.id===id);if(d){d.status='besloten';d.decision=b.dataset.value;emit('HITL',`Besluit: ${d.decision}`,d.title);if(d.kind==='repair'){if(d.decision==='Andere worker'){const w=worker('W-06');w.status='geblokkeerd';for(const t of s.tasks.filter(x=>x.worker==='W-06'&&['blocked','review'].includes(x.state))){t.worker='W-15';t.state='queued'}emit('planning','Alternatieve worker ingepland','Demonstratie: werk herverdeeld naar Methodology Reviewer')}else if(d.decision==='Pauzeren'){mission(d.mission).status='gepauzeerd';emit('planning','Opdracht gepauzeerd',d.mission)}}}break;}default:return}render()});

document.addEventListener('input',e=>{if(e.target.id==='catalogSearch'){s.catalogSearch=e.target.value;render();const a=document.getElementById('catalogSearch');if(a){a.focus();a.setSelectionRange(s.catalogSearch.length,s.catalogSearch.length)}}if(e.target.id==='workerSearch'){s.workerSearch=e.target.value;const f=document.activeElement;render();const a=document.getElementById('workerSearch');if(a){a.focus();a.setSelectionRange(s.workerSearch.length,s.workerSearch.length)}}if(e.target.id==='parallel'){s.settings.parallel=Number(e.target.value);render()}if(e.target.id==='budget'){s.settings.budget=Number(e.target.value);render()}});
document.addEventListener('submit',e=>{if(e.target.id==='newMissionForm'){e.preventDefault();const title=document.getElementById('newTitle').value.trim(),description=document.getElementById('newDesc').value.trim();if(!title||!description)return;const id='M-'+String(s.missions.length+1).padStart(3,'0');s.missions.push({id,title,description,status:'actief',owner:'Demo gebruiker',created:'Nieuw',budget:0});const ts=[['Opdracht en randvoorwaarden beschrijven','W-01',0,[]],['Bronnen zoeken','W-04',1,[0]],['Gegevens analyseren','W-07',2,[1]],['Conceptresultaat maken','W-13',3,[2]],['Resultaat controleren','W-10',4,[3]]];const ids=ts.map((_,i)=>'T-'+id.slice(2)+'-'+(i+1));ts.forEach(([title,w,phase,deps],i)=>s.tasks.push({id:ids[i],mission:id,phase,title,worker:w,state:'queued',depends:deps.map(v=>ids[v]),size:'middel'}));s.selectedMission=id;s.modal=null;s.route='opdrachten';emit('planning','Demo-opdracht aangemaakt',title);render()}if(e.target.id==='builderForm'){e.preventDefault();const name=document.getElementById('buildName').value.trim(),goal=document.getElementById('buildGoal').value.trim(),size=document.getElementById('buildSize').value,group=document.getElementById('buildGroup').value;if(!name||!goal)return;const id='W-'+String(s.workers.length+1).padStart(2,'0');s.workers.push({id,name,role:goal,group,size:size==='Automatisch bepalen'?'Middel':size,model:size==='Automatisch bepalen'?'Nog vast te stellen':size,tools:'Nog te selecteren',permissions:'Alleen testomgeving',success:0,baseline:0,drift:0,status:'proef',repairs:0,total:0,ver:'0.1.0',skills:['Nieuwe specialisatie','Niet gevalideerd']});s.selectedWorker=id;s.buildResults={name,summary:'Nieuw concept in de Worker Registry. Nog geen echte implementatie, benchmarks of geslaagde tests.'};emit('builder','Demo-workercontract toegevoegd',name);render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.modal){s.modal=null;render()}});
document.addEventListener('submit',e=>{if(e.target.id==='ops-register')registerOps(e);if(e.target.id==='realMissionForm')createRealMission(e);if(e.target.id==='liveRepoSearchForm')searchRepository(e);if(e.target.id==='livePlannerForm')requestPlanProposal(e);if(e.target.id==='liveBuilderForm')requestBuilderProposal(e)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action="ops-human-decide"]');if(b)decideOps(b.dataset.id,b.dataset.choice)});
render();
</script>
