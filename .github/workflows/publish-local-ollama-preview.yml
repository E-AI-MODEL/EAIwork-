name: publish-local-ollama-preview
on:
  push:
    branches:
      - feature/local-ollama-first-run-v01-20261110
    paths:
      - '.github/workflows/publish-local-ollama-preview.yml'

permissions:
  contents: write

jobs:
  local-ollama-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify immutable preview target and license
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "E-AI-MODEL/EAIwork-"
          test "$GITHUB_REF_NAME" = "feature/local-ollama-first-run-v01-20261110"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ! gh release view v0.2.0-preview.2 >/dev/null 2>&1
          grep -q '^# PolyForm Noncommercial License 1.0.0' LICENSE
          test -s scripts/local-ollama.ts
      - name: Run full suite with local Ollama HTTP integration test
        run: npm test
      - name: Build verified local ZIP and hashes
        run: |
          set -euo pipefail
          python3 scripts/build-distribution.py build
          python3 scripts/build-distribution.py verify dist/eaiwork-local-demo.zip
          cd dist
          sha256sum eaiwork-local-demo.zip > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Verify launcher exists and loads from extracted ZIP
        run: |
          set -euo pipefail
          mkdir -p /tmp/eaiwork-ollama-preview
          python3 -m zipfile -e dist/eaiwork-local-demo.zip /tmp/eaiwork-ollama-preview
          cd /tmp/eaiwork-ollama-preview
          node --input-type=module -e 'import {chooseInstalledModel,parseLocalOllamaArgs} from "./scripts/local-ollama.ts"; if(chooseInstalledModel(["qwen2.5:1.5b"])!=="qwen2.5:1.5b")process.exit(1); if(parseLocalOllamaArgs([],{}).port!==8788)process.exit(1)'
      - name: Create prerelease (no deployment)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.2.0-preview.2 \
            dist/eaiwork-local-demo.zip dist/SHA256SUMS LICENSE \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "EAIwork v0.2.0 preview.2: lokaal met Ollama" \
            --notes "Lokale demonstratie met optionele Ollama-planvoorstellen. Vereist Node.js 22.18+, een draaiende Ollama-dienst en een vooraf geïnstalleerd model. Start na uitpakken met npm run local:ollama -- --model=MODELNAAM. Het model mag alleen een conceptplan voorstellen; menselijke toestemming en lokale workercontroles blijven verplicht. Dit pakket bewaart nog geen blijvende werksessie en is geen autonome softwareproductieomgeving. Geen cloudmodel, publieke server of eaimodel.nl-deployment. Softwarelicentie: PolyForm Noncommercial 1.0.0."
      - name: Download and verify published artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir /tmp/eaiwork-ollama-published
          gh release download v0.2.0-preview.2 --repo "$GITHUB_REPOSITORY" --dir /tmp/eaiwork-ollama-published
          cd /tmp/eaiwork-ollama-published
          sha256sum -c SHA256SUMS
          cmp LICENSE "$GITHUB_WORKSPACE/LICENSE"
          python3 "$GITHUB_WORKSPACE/scripts/build-distribution.py" verify eaiwork-local-demo.zip
