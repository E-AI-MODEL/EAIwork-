name: artifact-real-proof
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  local-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build a small JS artifact and test its functions
        run: node scripts/real-github-artifact-smoke.ts build
      - name: Upload the exact candidate file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eaiwork-real-proof
          path: dist/eaiwork-proof.mjs
          if-no-files-found: error
          retention-days: 2
      - name: Verify artifact from an earlier completed run through EAIwork
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          EAI_REQUIRE_PREVIOUS: "1"
        run: node scripts/real-github-artifact-smoke.ts verify
