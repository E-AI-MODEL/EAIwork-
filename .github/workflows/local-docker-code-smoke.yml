name: local-docker-code-smoke
on:
  push:
    branches:
      - feature/docker-isolated-code-test-v01-20261110
    paths:
      - '.github/workflows/local-docker-code-smoke.yml'
      - 'packages/operations/src/docker-code-test.ts'
      - 'tests/docker-sandbox-smoke.test.ts'
  pull_request:
    paths:
      - '.github/workflows/local-docker-code-smoke.yml'
      - 'packages/operations/src/docker-code-test.ts'
      - 'tests/docker-sandbox-smoke.test.ts'
permissions:
  contents: read
jobs:
  isolate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Prepare image outside the isolated test container
        run: |
          set -euo pipefail
          docker version
          docker pull node:22-alpine
      - name: Run real JavaScript tests in a container without network and write access
        env:
          EAI_DOCKER_SMOKE: "1"
        run: node --test tests/docker-sandbox-smoke.test.ts
