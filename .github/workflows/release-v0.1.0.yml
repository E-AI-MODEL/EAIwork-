name: Release v0.1.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Release v0.1.0')
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create v0.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.1.0 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "v0.1.0 already exists"
            exit 0
          fi

          gh release create v0.1.0             --repo "$GH_REPO"             --target "$GITHUB_SHA"             --title "EAI work v0.1.0"             --notes-file docs/releases/v0.1.0.md
