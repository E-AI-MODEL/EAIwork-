name: local-demo-package
on:
  pull_request:
    paths:
      - "packages/**"
      - "packs/**"
      - "scripts/local-demo.ts"
      - "scripts/local-text-executor.ts"
      - "scripts/build-distribution.py"
      - "package.json"
      - ".github/workflows/local-demo-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test exact source before packaging
        run: npm test
      - name: Build package and verify each included file
        run: python3 scripts/build-distribution.py build
      - name: Run dashboard package from extracted ZIP
        run: |
          mkdir -p /tmp/eaiwork-package-test
          python3 -m zipfile -e dist/eaiwork-local-demo.zip /tmp/eaiwork-package-test
          cd /tmp/eaiwork-package-test
          node --input-type=module -e 'import {createDemoServer} from "./scripts/local-demo.ts"; const demo=createDemoServer({schedulerIntervalMs:0}); await new Promise(resolve=>demo.server.listen(0,"127.0.0.1",resolve)); const {port}=demo.server.address(); const response=await fetch("http://127.0.0.1:"+port+"/dashboard"); if(response.status!==200)process.exitCode=1; await demo.close()'
      - name: Store downloadable candidate; no release or deployment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eaiwork-local-demo-candidate
          path: dist/eaiwork-local-demo.zip
          if-no-files-found: error
          retention-days: 14
