<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">EAI work evidence-first work graph</title>
  <desc id="desc">A set of connected atomic questions moving from unknown and claims toward checked evidence, with a separate evidence trace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7f8f5"/><stop offset="1" stop-color="#ecefe9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1e2b24" flood-opacity=".08"/></filter>
  </defs>
  <rect width="1400" height="720" rx="32" fill="url(#bg)"/>
  <text x="72" y="94" font-family="Inter,system-ui,sans-serif" font-size="19" font-weight="700" fill="#657069" letter-spacing="3">EAI WORK</text>
  <text x="72" y="158" font-family="Inter,system-ui,sans-serif" font-size="52" font-weight="760" fill="#151a17">Work assembled from checkable questions.</text>
  <text x="72" y="203" font-family="Inter,system-ui,sans-serif" font-size="23" fill="#657069">Status follows evidence. Dependencies stay visible. AI cannot promote itself.</text>

  <g stroke="#cbd1cb" stroke-width="3" fill="none">
    <path d="M300 388 C420 355 505 352 618 382"/>
    <path d="M300 510 C420 522 505 480 618 426"/>
    <path d="M790 413 C910 430 940 520 1062 525"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter,system-ui,sans-serif">
    <g transform="translate(110 330)">
      <rect width="210" height="118" rx="18" fill="#fff" stroke="#d8ddd7"/>
      <circle cx="181" cy="26" r="7" fill="#4b9b73"/>
      <text x="22" y="30" font-size="13" font-weight="700" fill="#6b746e" letter-spacing="1.5">ATOM 01</text>
      <text x="22" y="62" font-size="18" font-weight="700" fill="#171c19">Budget filed?</text>
      <text x="22" y="92" font-size="14" fill="#6b746e">proven · deterministic check</text>
    </g>
    <g transform="translate(110 472)">
      <rect width="210" height="118" rx="18" fill="#fff" stroke="#d8ddd7"/>
      <circle cx="181" cy="26" r="7" fill="#75a9d4"/>
      <text x="22" y="30" font-size="13" font-weight="700" fill="#6b746e" letter-spacing="1.5">ATOM 02</text>
      <text x="22" y="62" font-size="18" font-weight="700" fill="#171c19">Start date fixed?</text>
      <text x="22" y="92" font-size="14" fill="#6b746e">observed · person</text>
    </g>
    <g transform="translate(600 357)">
      <rect width="250" height="130" rx="18" fill="#fff" stroke="#d8ddd7"/>
      <circle cx="220" cy="27" r="7" fill="#e89a5c"/>
      <text x="22" y="31" font-size="13" font-weight="700" fill="#6b746e" letter-spacing="1.5">ATOM 03</text>
      <text x="22" y="65" font-size="18" font-weight="700" fill="#171c19">Budget approved?</text>
      <text x="22" y="96" font-size="14" fill="#6b746e">claim · needs another origin</text>
    </g>
    <g transform="translate(1040 484)">
      <rect width="250" height="130" rx="18" fill="#fff" stroke="#d8ddd7"/>
      <circle cx="220" cy="27" r="7" fill="#c8ccc8"/>
      <text x="22" y="31" font-size="13" font-weight="700" fill="#6b746e" letter-spacing="1.5">ATOM 04</text>
      <text x="22" y="65" font-size="18" font-weight="700" fill="#171c19">Ready to start?</text>
      <text x="22" y="96" font-size="14" fill="#6b746e">unknown · dependency open</text>
    </g>
  </g>

  <g transform="translate(918 270)" font-family="Inter,system-ui,sans-serif">
    <rect width="372" height="126" rx="18" fill="#172019"/>
    <text x="22" y="34" font-size="12" font-weight="700" fill="#aeb8b0" letter-spacing="1.5">EVIDENCE TRACE</text>
    <text x="22" y="66" font-size="17" font-weight="700" fill="#f1f4f1">observer → source → lineage</text>
    <text x="22" y="94" font-size="14" fill="#aeb8b0">Independent origins can raise status.</text>
  </g>

  <g transform="translate(72 660)" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#657069">
    <text x="0" y="0">append-only events</text><circle cx="160" cy="-5" r="3" fill="#9fa7a1"/>
    <text x="182" y="0">lineage-aware evidence</text><circle cx="370" cy="-5" r="3" fill="#9fa7a1"/>
    <text x="392" y="0">derived status</text><circle cx="508" cy="-5" r="3" fill="#9fa7a1"/>
    <text x="530" y="0">no single score</text>
  </g>
</svg>
