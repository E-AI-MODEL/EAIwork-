<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="260" viewBox="0 0 1400 260" role="img" aria-labelledby="title desc">
  <title id="title">EAI work status ladder</title>
  <desc id="desc">Six evidence statuses from unknown through proven. Model output alone can reach assumption, while stronger statuses need person-attached evidence or deterministic checks.</desc>
  <rect width="1400" height="260" rx="26" fill="#f7f8f5"/>
  <text x="55" y="56" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="700" fill="#161b18">Evidence status is a ladder, not a score</text>
  <text x="55" y="84" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#68706c">Each atom keeps its own status. Model output cannot lift itself beyond assumption.</text>
  <g transform="translate(55 122)" font-family="Inter,system-ui,sans-serif">
    <g transform="translate(0)"><rect width="190" height="82" rx="14" fill="#eef0ed" stroke="#c8ccc8"/><circle cx="24" cy="24" r="7" fill="#c8ccc8"/><text x="42" y="29" font-size="15" font-weight="700" fill="#161b18">unknown</text><text x="18" y="57" font-size="12" fill="#68706c">no usable answer</text></g>
    <g transform="translate(210)"><rect width="190" height="82" rx="14" fill="#fffaf0" stroke="#e7c85d"/><circle cx="24" cy="24" r="7" fill="#e7c85d"/><text x="42" y="29" font-size="15" font-weight="700" fill="#161b18">assumption</text><text x="18" y="57" font-size="12" fill="#68706c">proposal only</text></g>
    <g transform="translate(420)"><rect width="190" height="82" rx="14" fill="#fff6ef" stroke="#e89a5c"/><circle cx="24" cy="24" r="7" fill="#e89a5c"/><text x="42" y="29" font-size="15" font-weight="700" fill="#161b18">claim</text><text x="18" y="57" font-size="12" fill="#68706c">person reported</text></g>
    <g transform="translate(630)"><rect width="190" height="82" rx="14" fill="#f1f7fb" stroke="#75a9d4"/><circle cx="24" cy="24" r="7" fill="#75a9d4"/><text x="42" y="29" font-size="15" font-weight="700" fill="#161b18">observed</text><text x="18" y="57" font-size="12" fill="#68706c">seen first-hand</text></g>
    <g transform="translate(840)"><rect width="190" height="82" rx="14" fill="#f0f4fa" stroke="#537fbd"/><circle cx="24" cy="24" r="7" fill="#537fbd"/><text x="42" y="29" font-size="15" font-weight="700" fill="#161b18">checked</text><text x="18" y="57" font-size="12" fill="#68706c">independent origin</text></g>
    <g transform="translate(1050)"><rect width="190" height="82" rx="14" fill="#f0f8f4" stroke="#4b9b73"/><circle cx="24" cy="24" r="7" fill="#4b9b73"/><text x="42" y="29" font-size="15" font-weight="700" fill="#161b18">proven</text><text x="18" y="57" font-size="12" fill="#68706c">deterministic check</text></g>
  </g>
</svg>
